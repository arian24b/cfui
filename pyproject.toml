[project]
name = "cfui"
version = "0.1.0"
description = "cf-style terminal UI and a tiny argparse app framework (help, version, update, prompts for missing options)."
readme = "README.md"
license = "MIT"
authors = [{name = "Arian Omrani", email = "arian24b@gmail.com"}]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/arian24b/cfui"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfui"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
